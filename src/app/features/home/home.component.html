<ion-header [translucent]="true" class="bg-dark border-bottom border-secondary">
  <ion-toolbar>
    <ion-title class="text-white">🎵 MIDI Playback Control</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="bg-dark">
  <div class="container-fluid py-4">
    <!-- Connection Status -->
    <div [ngClass]="isConnected ? 'alert-success' : 'alert-danger'" class="alert d-flex align-items-center gap-2 mb-3">
      <span class="badge" [ngClass]="isConnected ? 'bg-success' : 'bg-danger'" style="display: inline-block; width: 12px; height: 12px; border-radius: 50%;"></span>
      <span *ngIf="isConnected" class="text-success">✓ Connected to iPad • 192.168.1.100:5004</span>
      <span *ngIf="!isConnected && isLoading" class="text-info">🔄 Connecting...</span>
      <span *ngIf="!isConnected && !isLoading" class="text-danger">✗ Disconnected</span>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger mb-3">
      <small>{{ errorMessage }}</small>
    </div>

    <!-- Current Track Info -->
    <div class="card bg-secondary text-white mb-4">
      <div class="card-body text-center">
        <h5 class="card-title mb-2">🎵 Amazing Grace</h5>
        <p class="card-text mb-1">02:34 / 05:00</p>
        <p class="card-text small text-success">📍 Verso</p>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="row g-3">

      <!-- Section 1: Reprodução Básica -->
      <div class="col-12">
        <div class="card bg-secondary">
          <div class="card-body">
            <h6 class="card-title text-uppercase text-info mb-3">Reprodução</h6>
            <div class="row g-2">
              <div class="col-4 col-md-2">
                <button class="btn btn-success btn-lg w-100" [disabled]="!isConnected" (click)="onPlayClick()" style="min-height: 100px;">
                  <div class="text-center">
                    <div style="font-size: 36px;">▶️</div>
                    <small>Play</small>
                  </div>
                </button>
              </div>
              <div class="col-4 col-md-2">
                <button class="btn btn-success btn-lg w-100" [disabled]="!isConnected" (click)="onPauseClick()" style="min-height: 100px;">
                  <div class="text-center">
                    <div style="font-size: 36px;">⏸️</div>
                    <small>Pause</small>
                  </div>
                </button>
              </div>
              <div class="col-4 col-md-2">
                <button class="btn btn-danger btn-lg w-100" [disabled]="!isConnected" (click)="onStopClick()" style="min-height: 100px;">
                  <div class="text-center">
                    <div style="font-size: 36px;">⏹️</div>
                    <small>Stop</small>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2: Loops e Repetição -->
      <div class="col-12">
        <div class="card bg-secondary">
          <div class="card-body">
            <h6 class="card-title text-uppercase text-info mb-3">Loops</h6>
            <div class="row g-2">
              <div class="col-4 col-md-2">
                <button class="btn btn-primary btn-lg w-100" [disabled]="!isConnected" (click)="onLoopSectionClick()" style="min-height: 100px;">
                  <div class="text-center">
                    <div style="font-size: 36px;">📍</div>
                    <small>Loop Section</small>
                  </div>
                </button>
              </div>
              <div class="col-4 col-md-2">
                <button class="btn btn-primary btn-lg w-100" [disabled]="!isConnected" (click)="onRepeatClick()" style="min-height: 100px;">
                  <div class="text-center">
                    <div style="font-size: 36px;">🔁</div>
                    <small>Repeat</small>
                  </div>
                </button>
              </div>
              <div class="col-4 col-md-2">
                <button class="btn btn-warning btn-lg w-100 text-dark" [disabled]="!isConnected" (click)="onInfinityLoopClick()" style="min-height: 100px;">
                  <div class="text-center">
                    <div style="font-size: 36px;">∞</div>
                    <small>Loop Infinito</small>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 3: Pads -->
      <div class="col-12">
        <div class="card bg-secondary">
          <div class="card-body">
            <h6 class="card-title text-uppercase text-info mb-3">Pads</h6>
            <div class="row g-2">
              <div class="col-3 col-sm-2 col-md-1-5" *ngFor="let pad of pads; let i = index">
                <button class="btn w-100" 
                        [ngClass]="pad.active ? 'btn-success' : 'btn-secondary'"
                        [disabled]="!isConnected"
                        (click)="onPadClick(i)"
                        style="min-height: 90px; aspect-ratio: 1;">
                  <div class="text-center">
                    <div style="font-size: 20px; font-weight: bold;">{{ i + 1 }}</div>
                    <small *ngIf="pad.active">✓</small>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 4: Volume e Áudio -->
      <div class="col-12">
        <div class="card bg-secondary">
          <div class="card-body">
            <h6 class="card-title text-uppercase text-info mb-3">Áudio</h6>
            <div class="row g-2">
              <div class="col-6 col-md-2">
                <button class="btn btn-warning btn-lg w-100 text-dark" [disabled]="!isConnected" (click)="onFadeInClick()" style="min-height: 100px;">
                  <div class="text-center">
                    <div style="font-size: 36px;">🔊</div>
                    <small>Fade In</small>
                  </div>
                </button>
              </div>
              <div class="col-6 col-md-2">
                <button class="btn btn-warning btn-lg w-100 text-dark" [disabled]="!isConnected" (click)="onFadeOutClick()" style="min-height: 100px;">
                  <div class="text-center">
                    <div style="font-size: 36px;">🔇</div>
                    <small>Fade Out</small>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</ion-content>
